name: Plataforma Etapa 2 — TypeScript e build
on:
  push:
    branches: [main]
    paths: ['plataforma/**', '.github/workflows/plataforma-etapa2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plataforma
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar contratos de segurança
        run: node --test scripts/security-contracts.test.mjs
      - name: Verificar tipos
        run: npm run typecheck
      - name: Compilar Next.js
        run: npm run build
        env:
          ENABLE_REGISTRATION: 'false'
